<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Revista interactiva del catálogo Simple 2026.">
  <title>Simple — Revista interactiva SS26</title>
  <link rel="stylesheet" href="revista-interactiva.css">
</head>
<body>
  <header class="reader-header">
    <a class="reader-brand" href="../index.html" aria-label="Volver a la presentación"><span></span>Simple</a>
    <p>Catálogo interactivo · SS26</p>
  </header>

  <main class="reader" aria-label="Revista interactiva Simple">
    <div class="book-shell" id="book-shell" aria-live="polite">
      <div class="book-stage" id="book-stage"></div>
      <div class="loading-card" id="loading-card"><span></span><b>Cargando catálogo</b></div>
    </div>

    <p class="gesture-hint" id="gesture-hint">Arrastrá para pasar página <span>← →</span></p>
  </main>

  <nav class="floating-actions" aria-label="Opciones del catálogo">
    <a href="catalogo-simple-21-paginas.html">Ver HTML <span>↗</span></a>
    <a class="download-action" href="catalogo-simple-21-paginas.pdf" download>Descargar PDF <span>↓</span></a>
    <button class="qr-action" id="show-qr" type="button" aria-haspopup="dialog" aria-controls="qr-dialog">Mostrar QR <span aria-hidden="true">▦</span></button>
  </nav>

  <dialog class="qr-dialog" id="qr-dialog" aria-labelledby="qr-title" aria-describedby="qr-description">
    <div class="qr-dialog-header">
      <span class="qr-brand"><span class="qr-brand-mark" aria-hidden="true"></span>Simple</span>
      <button class="qr-close" id="close-qr" type="button" aria-label="Cerrar código QR">×</button>
    </div>
    <div class="qr-dialog-content">
      <p class="qr-eyebrow">Catálogo · SS26</p>
      <h2 id="qr-title">Escaneá el catálogo</h2>
      <p id="qr-description">Abrí la experiencia Simple desde tu teléfono.</p>
      <div class="qr-image-frame"><img src="../web-manual-simple/qr-code.png" alt="Código QR de Simple para abrir el catálogo" width="1148" height="1148"></div>
    </div>
  </dialog>

  <script src="vendor/page-flip/page-flip.browser.js"></script>
  <script src="revista-interactiva.js"></script>
</body>
</html>
